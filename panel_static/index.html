<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duality-Panel</title>
  <link rel="stylesheet" href="/static/panel.css">
  <script src="/static/panel.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Zum Inhalt springen</a>
  <div class="layout">
    <header class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Duality-Panel</div>
      <nav aria-label="Bereiche">
        <ul id="nav">
          <li><a href="#dashboard" data-page="dashboard" data-level="1">Dashboard</a></li>
          <li><a href="#konsole" data-page="konsole" data-level="1">Konsole</a></li>
        </ul>
      </nav>
      <div class="user">
        <img id="user-avatar" src="data:," alt="" width="32" height="32">
        <div>
          <div id="user-name">…</div>
          <div class="muted" id="user-role"></div>
        </div>
        <button type="button" class="small" id="logout">Abmelden</button>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <div class="banner" id="connection-banner" role="status" hidden></div>

      <section id="page-dashboard" class="page" aria-labelledby="title-dashboard">
        <h1 id="title-dashboard">Dashboard</h1>
        <div class="grid">
          <article class="card" aria-labelledby="card-bot">
            <h2 id="card-bot">Bot</h2>
            <dl class="stat-list" id="dash-bot"></dl>
          </article>
          <article class="card" aria-labelledby="card-guild">
            <h2 id="card-guild">Server</h2>
            <dl class="stat-list" id="dash-guild"></dl>
          </article>
          <article class="card" aria-labelledby="card-api">
            <h2 id="card-api">HenrikDev-API</h2>
            <dl class="stat-list" id="dash-api"></dl>
          </article>
        </div>
        <article class="card spaced" aria-labelledby="card-tasks">
          <h2 id="card-tasks">Hintergrund-Tasks</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th scope="col">Task</th><th scope="col">Status</th><th scope="col">Letzter Lauf</th><th scope="col">Nächster Lauf</th><th scope="col">Letzter Fehler</th></tr>
              </thead>
              <tbody id="dash-tasks"></tbody>
            </table>
          </div>
        </article>
        <p class="muted small" id="dash-updated">Warte auf Daten vom Bot …</p>
      </section>

      <section id="page-konsole" class="page" aria-labelledby="title-konsole" hidden>
        <h1 id="title-konsole">Konsole</h1>
        <div class="console">
          <div class="console-toolbar">
            <fieldset>
              <legend>Angezeigte Level</legend>
              <label><input type="checkbox" name="log-level" value="DEBUG"> Debug</label>
              <label><input type="checkbox" name="log-level" value="INFO" checked> Info</label>
              <label><input type="checkbox" name="log-level" value="WARNING" checked> Warnung</label>
              <label><input type="checkbox" name="log-level" value="ERROR" checked> Fehler</label>
            </fieldset>
            <label class="visually-hidden" for="log-search">Im Log suchen</label>
            <input type="search" id="log-search" placeholder="Im Log suchen …">
            <button type="button" id="log-pause" aria-pressed="false">Auto-Scroll pausieren</button>
          </div>
          <ol class="log" id="log" aria-label="Log-Ausgabe"></ol>
          <form class="command-line" id="command-form" autocomplete="off">
            <label class="visually-hidden" for="command-input">Befehl</label>
            <input id="command-input" list="command-list" placeholder="Befehl, z. B. help (Tab ergänzt, ↑/↓ Verlauf)"
                   spellcheck="false" autocapitalize="off" maxlength="2100">
            <datalist id="command-list"></datalist>
            <button type="submit" class="primary">Ausführen</button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title">Wirklich ausführen?</h2>
      <p id="confirm-text"></p>
      <p class="mono" id="confirm-command"></p>
      <div class="actions">
        <button value="cancel" type="submit" autofocus>Abbrechen</button>
        <button value="ok" type="submit" class="danger" id="confirm-ok">Ausführen</button>
      </div>
    </form>
  </dialog>
  </div>
</body>
</html>
